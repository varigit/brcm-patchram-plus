name: Build and Publish Debian Package

on:
  push:
    branches:
      - main

jobs:
  build-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        architecture: [arm64]
        debian_version: [bookworm]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@v2
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Get the current version and commit ID
        id: version_info
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          VERSION="1:0+git$(git rev-list --count HEAD).${COMMIT}-1"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "COMMIT=$COMMIT" >> $GITHUB_ENV

      - name: Build the Debian package
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            debian:${{ matrix.debian_version }} \
            bash -c "
              apt update && \
              apt install -y build-essential devscripts debhelper dpkg-dev && \
              # Create debian/changelog dynamically
              dch --create --package brcm-patchram-plus --newversion ${{ env.VERSION }} --distribution ${{ matrix.debian_version }} \
                'Generated changelog for commit ${{ env.COMMIT }}' && \
              dpkg-buildpackage -b -us -uc -a arm64 && \
              mkdir -p output && \
              mv ../*.deb output/
            "

      - name: Upload the package as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-package-arm64
          path: output/*.deb
